media:
  input: media
  output: /media
content:
  - name: staging
    label: Staging site
    type: file
    path: staging.yml
    format: yaml
    fields:
      - name: visitor_url
        label: Visitor URL
        type: string
        required: true
      - name: live_site
        label: Live site, do not open
        type: string
      - name: note
        label: Note
        type: text
  - name: pages
    label: Pages
    type: collection
    path: content/pages
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, description]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: string
      - name: layout
        label: Layout
        type: string
        hidden: true
        default: default
      - name: permalink
        label: URL
        type: string
      - name: body
        label: Body
        type: rich-text
