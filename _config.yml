title: MausBot
description: Pages from the MausBot sitemap.
# Visitor site is https://techfundoffice.github.io/mausbot-pages/
# GitHub Pages publishes mirror/ from .github/workflows/pages.yml.
# This Jekyll config is not the visitor site.
url: https://techfundoffice.github.io
baseurl: /mausbot-pages
theme: jekyll-theme-cayman
show_downloads: false
plugins:
  - jekyll-seo-tag
exclude:
  - mirror
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
